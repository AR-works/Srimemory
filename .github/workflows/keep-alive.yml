name: Manual Health Check

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab if ever needed

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Sri Memory health endpoint..."
          RESPONSE=$(curl -s https://srimemory.vercel.app/api/health)
          echo "Response from server:"
          echo "$RESPONSE"
