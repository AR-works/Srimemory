name: Keep Supabase Alive

on:
  schedule:
    # Runs 3 times a day (every 8 hours: 00:00, 08:00, 16:00 UTC)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Sri Memory health endpoint to keep Supabase active..."
          RESPONSE=$(curl -s https://srimemory.vercel.app/api/health)
          echo "Response from server:"
          echo "$RESPONSE"
